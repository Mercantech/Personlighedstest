# Dokploy-deploy: docker compose up -d --build
#
# Routing (Mercantec):
#   1. Cloudflare: *.mercantec.tech (wildcard CNAME → tunnel)
#   2. Tunnel ingress: → http://localhost:80
#   3. Traefik (Dokploy): Host(`16.mercantec.tech`) → web:3000
#
# Kun frontend er eksponeret via Traefik. api + db er kun internt.
# Browser kalder /api/* → nginx → http://api:3001/api/*
#
# Lokal udvikling med host-porte:
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up --build

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-samspil}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-samspil}
      POSTGRES_DB: ${POSTGRES_DB:-samspil}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./api/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - internal
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-samspil} -d ${POSTGRES_DB:-samspil}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      HOST: ${HOST:-0.0.0.0}
      PORT: ${API_PORT:-3001}
      DATABASE_URL: ${DATABASE_URL:-postgres://samspil:samspil@db:5432/samspil}
      AUTH_ISSUER: ${AUTH_ISSUER:-https://auth.mercantec.tech}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-mercantec-apps}
      JWKS_URI: ${JWKS_URI:-https://auth.mercantec.tech/.well-known/jwks.json}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://16.mercantec.tech}
      ADMIN_ROLES: ${ADMIN_ROLES:-admin}
      ADMIN_ALLOWLIST: ${ADMIN_ALLOWLIST:-}
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-qO-",
          "http://127.0.0.1:3001/api/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_AUTH_CLIENT_ID: ${VITE_AUTH_CLIENT_ID:-samspil}
        VITE_ADMIN_ROLES: ${VITE_ADMIN_ROLES:-admin}
        VITE_ADMIN_ALLOWLIST: ${VITE_ADMIN_ALLOWLIST:-}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks:
      - dokploy-network
      - internal
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.samspil-16.rule=Host(`16.mercantec.tech`)
      - traefik.http.routers.samspil-16.entrypoints=web
      - traefik.http.routers.samspil-16.service=samspil
      - traefik.http.services.samspil.loadbalancer.server.port=3000
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

networks:
  dokploy-network:
    external: true
  internal:

volumes:
  postgres_data:
